name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GW_SKIP_SNAPSHOTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Lint
        run: make lint

      - name: Package tests
        run: make test-core

      - name: Build app
        run: make build-unsigned
