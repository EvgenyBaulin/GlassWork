name: GlassWork
options:
  bundleIdPrefix: io.github.evgenybaulin
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  GlassWorkKit:
    path: Packages/GlassWorkKit
targets:
  GlassWork:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
      - path: App/LaunchDaemons/io.github.evgenybaulin.GlassWork.FanHelper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: GlassWorkKit
        product: GlassWorkCore
      - package: GlassWorkKit
        product: GlassWorkUI
      - target: GlassWorkWidgets
        embed: true
        codeSign: true
      - target: GlassWorkFanHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    entitlements:
      path: App/GlassWork.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.personal-information.addressbook: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GlassWork
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleURLTypes:
          - CFBundleURLName: io.github.evgenybaulin.GlassWork
            CFBundleURLSchemes: [glasswork]
        CFBundleLocalizations: [en, ru]
        GWAppGroupID: $(APP_GROUP_ID)
        NSCalendarsFullAccessUsageDescription: GlassWork shows your events in the menu bar and in widgets.
        NSRemindersFullAccessUsageDescription: GlassWork shows and ticks off your reminders.
        NSPhotoLibraryUsageDescription: Your photos from this day in past years appear in the On This Day widget.
        NSContactsUsageDescription: Names and birthdays appear in the Birthdays widget. Nothing leaves this Mac.
        NSLocationUsageDescription: Your location is used only to ask Open-Meteo for the forecast.
        NSLocationWhenInUseUsageDescription: Your location is used only to ask Open-Meteo for the forecast.
        NSHumanReadableCopyright: Copyright © 2026 Evgeny Baulin. MIT License.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).GlassWork
        PRODUCT_NAME: GlassWork
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GlassWorkWidgets:
    type: app-extension
    platform: macOS
    sources:
      - Widgets/Sources
      - Widgets/Resources
    dependencies:
      - package: GlassWorkKit
        product: GlassWorkCore
      - package: GlassWorkKit
        product: GlassWorkUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    entitlements:
      path: Widgets/GlassWorkWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: GlassWork
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ru]
        GWAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).GlassWork.Widgets
        PRODUCT_NAME: GlassWorkWidgets
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks
  GlassWorkFanHelper:
    type: tool
    platform: macOS
    sources:
      - Helper/Sources
    dependencies:
      - package: GlassWorkKit
        product: GlassWorkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).GlassWork.FanHelper
        PRODUCT_NAME: GlassWorkFanHelper
        SKIP_INSTALL: YES
        # A tool has no bundle to take its signing identifier from, and the app checks it by name.
        OTHER_CODE_SIGN_FLAGS: --identifier $(PRODUCT_BUNDLE_IDENTIFIER)
schemes:
  GlassWork:
    build:
      targets:
        GlassWork: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
